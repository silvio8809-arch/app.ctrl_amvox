<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<title>Orçamento &amp; Controladoria 2027</title>
<style>
/* App ORÇAMENTO & CONTROLADORIA 2027 (Silvio, 12–13/11/2026). Layout = AMVOX Finance Suite v2 (software_ctrl/app_amvox_v2.html):
   menu lateral em árvore azul-marinho, item ativo vermelho #C8102E, cadeado por perfil, caixa do usuário, barra superior com seletores.
   NENHUM dado embutido: a página é casca; os blocos vêm da tabela orc_bloco do Supabase (RLS por aplicativo 'orcamento') depois do login.
   Especificação: docs/ESPECIFICACAO_APP_ORCAMENTO.md */
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--ink:#16202E;--ink2:#5B6472;--ink3:#8A93A0;
  --brand:#C8102E;--brand-soft:#FCEBEE;--accent:#1F6FEB;--accent-soft:#EAF1FB;--pos:#1A7F4B;--pos-soft:#E7F4EC;--neg:#C0392B;--neg-soft:#FBEAE8;
  --warn:#B7791F;--warn-soft:#FEF3C7;--line:#E3E7ED;--line2:#F0F2F5;--band:#EEF2F6;--navbg:#16202E;--navink:#AEB7C4;--navhover:#202B3B;
  --strong:#16202E;--ed:#FFF6D6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,select,input{font:inherit}
.app{display:flex;min-height:100vh}

/* ---------- menu lateral (árvore) ---------- */
.side{width:248px;flex-shrink:0;background:var(--navbg);color:var(--navink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:18px 20px 14px;font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff}
.brand b{color:var(--brand)}
.brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:1.1px;color:var(--navink);margin-top:3px}
.nav{flex:1;padding:4px 10px 10px;overflow-y:auto}
.nav a,.nav .grp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--navink);text-decoration:none;font-size:12.5px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#8C97A8;font-weight:700;margin-top:6px;padding:9px 10px}
.nav .grp .seta{margin-left:auto;font-size:15px;line-height:1;opacity:.8;transition:transform .15s;display:inline-block}
.nav .grp .seta.ab{transform:rotate(90deg)}
.nav .grp:hover{color:#fff}
.nav .itens{display:flex;flex-direction:column;gap:1px;margin:0 0 4px 14px;border-left:1px solid #2A3647;padding-left:6px}
.nav .itens.fechado{display:none}
.nav a .ico{width:16px;flex-shrink:0;opacity:.85;text-align:center}
.nav a:hover{background:var(--navhover);color:#fff}
.nav a.active{background:var(--brand);color:#fff}
.nav a.locked{opacity:.32;cursor:not-allowed}
.nav a.locked:hover{background:none;color:var(--navink)}
.nav .lk{margin-left:auto;font-size:10.5px;opacity:.75}
.nav .grp.locked{opacity:.4}
.userbox{border-top:1px solid #26313F;padding:12px 14px 14px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.who .nm{font-size:12px;color:#fff;font-weight:600;line-height:1.3;word-break:break-all}
.who .rl{font-size:11px;color:var(--navink)}
.userbox label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6B7686;margin:8px 0 4px}
.userbox select{width:100%;font-size:12px;background:var(--navhover);color:#fff;border:1px solid #2E3A4A;border-radius:7px;padding:7px 8px;cursor:pointer}
.rolehint{font-size:10.5px;color:#6B7686;margin-top:7px;line-height:1.5}

/* ---------- barra superior ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:14px;row-gap:8px;padding:12px 24px 10px;position:sticky;top:0;z-index:30}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px}
.topbar .tt{min-width:0;grid-column:2}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.2px}
.topbar .sub{font-size:12px;color:var(--ink2);margin-top:1px}
.topbar .cx-dir{grid-column:3;grid-row:1;margin-left:0!important;color:var(--ink3)!important;max-width:330px;line-height:1.5!important;font-size:10.5px!important}
.topbar .cx-quem b{color:var(--ink)!important}
.sels{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sels label{display:flex;align-items:center;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600}
.sels select{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;color:var(--ink);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.access-badge{margin-left:auto;font-size:11px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--brand-soft);color:#8A1322;border:1px solid #F3C5CD;white-space:nowrap}
.access-badge.ro{background:var(--accent-soft);color:#1A3E6E;border-color:#C3D8F4}
.faixa-fase{background:#FFF7E6;border-bottom:1px solid #F0DBA8;color:#6B4E00;font-size:12px;padding:7px 24px;line-height:1.5}
.faixa-fase b{color:#4A3500}
.content{padding:20px 24px 80px;display:flex;flex-direction:column;gap:18px;min-width:0}
#tela{display:flex;flex-direction:column;gap:18px;min-width:0}
.status{font-size:13px;color:var(--ink2);padding:40px 0;text-align:center}
.foot{font-size:11px;color:var(--ink3);text-align:center;padding:6px 0 0}

/* ---------- blocos ---------- */
.head-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title h2{font-size:17px;font-weight:700}
.title p{font-size:12px;color:var(--ink2);margin-top:3px;max-width:980px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative;overflow:hidden;text-align:left;color:inherit;cursor:pointer}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.kpi.k2::before{background:var(--accent)}.kpi.k3::before{background:#8A5A00}.kpi.k4::before{background:var(--pos)}.kpi.k5::before{background:#6B7686}
.kpi:hover{border-color:#C9D1DC}
.kpi.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:7px 0 5px;font-variant-numeric:tabular-nums}
.kpi .meta{font-size:11.5px;color:var(--ink2);line-height:1.45}
.up{color:var(--pos)}.down{color:var(--neg)}.warn{color:var(--warn)}
.row2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-size:11.5px;font-weight:500;color:var(--ink3)}
.card .csub{font-size:12px;color:var(--ink2);margin:2px 0 10px;line-height:1.5}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.sumline:last-child{border-bottom:none}
.sumline .t{font-size:12.5px;color:var(--ink2)}
.sumline .v{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.sumline .v small{font-weight:500;color:var(--ink3);font-size:11px;margin-left:6px}
.sumline.big .t{font-weight:700;color:var(--ink)}.sumline.big .v{font-size:15px;font-weight:700}
.sumline.clic{cursor:pointer}.sumline.clic:hover{background:#FAFBFC}
.barra{height:6px;border-radius:3px;background:var(--band);overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;background:var(--brand)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2);margin:4px 0;flex-wrap:wrap}
.legend i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.info{background:var(--accent-soft);border:1px solid #C3D8F4;color:#1A3E6E;border-radius:9px;padding:10px 14px;font-size:12px;line-height:1.6}
.aviso{background:var(--warn-soft);border:1px solid #F0DBA8;color:#6B4E00;border-radius:9px;padding:10px 14px;font-size:12px;line-height:1.6}
.ok-box{background:var(--pos-soft);border:1px solid #BFE0CB;color:#14532D;border-radius:9px;padding:10px 14px;font-size:12px;line-height:1.6}
.vazio{color:var(--ink3);padding:22px 6px;text-align:center;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#C9D1DC}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.filtros{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.filtros .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700}
.filtros select{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface);color:var(--ink);max-width:320px}
.btn{font-size:12px;font-weight:600;border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.2px;background:var(--band);color:#3D4655;white-space:nowrap}
.tag.g{background:var(--pos-soft);color:var(--pos)}.tag.r{background:var(--neg-soft);color:var(--neg)}.tag.y{background:var(--warn-soft);color:var(--warn)}.tag.b{background:var(--accent-soft);color:#1A3E6E}
.sem{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px}
.sem.g{background:#2EA45F}.sem.y{background:#E0A100}.sem.r{background:#D64545}.sem.c{background:#C4CCD6}
.ck{font-weight:700}.ck.ok{color:var(--pos)}.ck.no{color:var(--neg)}

/* ---------- tabelas ---------- */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 210px)}
.tw.solta{max-height:none}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t thead th{position:sticky;top:0;background:var(--band);z-index:6;font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:var(--ink3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t thead th.n{text-align:right}
table.t thead th.sort{cursor:pointer;user-select:none}
table.t thead th.sort:hover{color:var(--ink)}
table.t thead tr.g2 th{top:31px}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t td.n{text-align:right;white-space:nowrap}
table.t td.w{white-space:normal;min-width:220px;max-width:420px}
table.t td.nw{white-space:nowrap}
table.t .fx{position:sticky;left:0;background:var(--surface);z-index:4;border-right:1px solid var(--line)}
table.t thead .fx{background:var(--band);z-index:8}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:#F8FAFC}
table.t tr.clic:hover td.fx{background:#F8FAFC}
table.t tfoot td{position:sticky;bottom:0;background:#F7F9FB;font-weight:700;border-top:1px solid var(--line);border-bottom:none;z-index:5}
table.t tfoot td.fx{z-index:7}
table.t td.ed{background:var(--ed)}
table.t th.ed{background:#F6E7AE;color:#6B4E00}
table.t .hl{background:#FDF3F5!important}
table.t thead th.hl{background:#F7DDE2!important;color:var(--brand)}
/* DRE */
table.dre td{height:28px;padding:5px 10px}
table.dre .lbl{display:flex;align-items:center;gap:6px;min-width:300px}
table.dre tr.d .lbl{padding-left:16px;color:var(--ink2)}
table.dre tr.dd .lbl{padding-left:32px;color:var(--ink3);font-size:12px}
table.dre tr.l td{font-weight:600}
table.dre tr.s td{background:var(--band);font-weight:600}
table.dre tr.s td.fx{background:var(--band)}
table.dre tr.t td{background:var(--strong);color:#fff;font-weight:700;border-bottom-color:#2A3647}
table.dre tr.t td.fx{background:var(--strong)}
table.dre tr.t .up,table.dre tr.t .down{color:#fff}
table.dre tr.p td{font-style:italic;color:var(--ink3);font-size:12px;height:24px}
table.dre tr.h td{background:#fff;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand);padding-top:12px;cursor:pointer}
table.dre tr.h td.fx{background:#fff}
table.dre tr.sal td{background:#F7F2F3;font-weight:700}
table.dre tr.sal td.fx{background:#F7F2F3}
table.dre tr.c td{font-size:11.5px;color:var(--ink3)}
table.dre tr.oculta{display:none}
.tgl{width:12px;display:inline-flex;justify-content:center;color:var(--ink3);font-size:9px;flex-shrink:0}
.grade-sub td{background:#FBFCFD}
.grade-sub td:first-child{padding-left:28px;color:var(--ink2)}

/* ---------- painel lateral (abertura até o lançamento) ---------- */
.painel-lateral{position:fixed;top:0;right:0;bottom:0;width:min(860px,96vw);background:var(--surface);box-shadow:-10px 0 30px rgba(22,32,46,.18);z-index:80;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
.painel-lateral.on{transform:none}
.painel-lateral .pl-top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.painel-lateral .pl-top h3{font-size:15px}
.painel-lateral .pl-top p{font-size:12px;color:var(--ink2);margin-top:3px}
.painel-lateral .pl-corpo{padding:14px 20px 30px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 11px;cursor:pointer;font-weight:600}
.veu{position:fixed;inset:0;background:rgba(22,32,46,.28);z-index:70;display:none}
.veu.on{display:block}

/* ---------- ciclo ---------- */
.linha-tempo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.marco{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;position:relative}
.marco .d{font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.marco .n{font-size:12.5px;font-weight:600;margin:4px 0 6px;line-height:1.35}
.marco.feito{border-color:#BFE0CB;background:#F6FBF8}
.marco.agora{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.quadro{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px}
.coluna{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.coluna h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:6px;font-size:12px;cursor:pointer}
.cartao:hover{border-color:#C9D1DC}
.cartao b{display:block;font-size:12px}
.cartao span{font-size:11px;color:var(--ink3)}
.arvore ul{list-style:none;margin-left:16px;border-left:1px dashed #CBD3DD;padding-left:10px}
.arvore>ul{margin-left:0;border:none;padding-left:0}
.arvore li{padding:3px 0}
.arvore .no{cursor:pointer;font-weight:700}
.arvore .cc{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.arvore .cc code{font-size:12px;background:var(--band);padding:0 5px;border-radius:4px}

.fixos{position:fixed;right:14px;bottom:14px;z-index:99}
.fixos button{cursor:pointer;border:1px solid #444;background:#141414;color:#eee;font:600 12px -apple-system,sans-serif;padding:7px 14px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.3);margin-left:8px}

@media (max-width:1100px){.row2,.row3{grid-template-columns:1fr}.quadro{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s ease;box-shadow:10px 0 30px rgba(0,0,0,.25)}
  body.menu-on .side{transform:none}
  .menu-btn{display:block}
  .topbar{padding:10px 16px;grid-template-columns:auto 1fr;position:static}
  .topbar .cx-dir{grid-column:1/-1;grid-row:auto;text-align:left!important}
  .content{padding:16px 16px 80px}
  .faixa-fase{padding:7px 16px}
  .access-badge{margin-left:0}
  .tw{max-height:none}
}
</style></head><body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">AM<b>VOX</b><small>ORÇAMENTO &amp; CONTROLADORIA</small></div>
    <nav class="nav" id="nav" aria-label="Menu do aplicativo"></nav>
    <div class="userbox" id="userbox"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
      <div class="tt"><h1 id="scrTitle">Orçamento &amp; Controladoria</h1><div class="sub" id="scopeSub"></div></div>
      <div class="sels" id="sels">
        <label>Período <select id="selPer"></select></label>
        <label>Cenário de receita <select id="selCen"></select></label>
        <label>Versão <select id="selVer"></select></label>
        <label>Unidade <select id="selUni"><option value="R$">R$</option><option value="mil">R$ mil</option><option value="mi">R$ milhões</option></select></label>
        <span class="access-badge" id="accessBadge"></span>
      </div>
    </header>
    <div class="faixa-fase" id="faixaFase" hidden></div>
    <div class="content">
      <div class="status" id="status">Carregando o orçamento…</div>
      <div id="tela"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>
<div class="veu" id="veu"></div>
<aside class="painel-lateral" id="drill" aria-hidden="true"></aside>
<div class="fixos"><button onclick="location.href='index.html'">⇄ Mudar de módulo</button><button onclick="sair()">Sair ↻</button></div>
<script src="orcamento.js"></script>
</body></html>
